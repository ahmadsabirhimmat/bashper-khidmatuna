<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/benawa-logo.png" />
    <link rel="apple-touch-icon" href="/benawa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050915" />
    <title>Bashper Khidmatuna Admin</title>
    <script>
      try {
        var theme = localStorage.getItem('bk-admin-theme');
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
